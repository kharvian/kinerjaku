name: Build KinerjaKu APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          mkdir -p android_source
          unzip -q KinerjaKu_Android_V1_8_D252_Aligned.zip -d android_source
          PROJECT_DIR=$(dirname "$(find android_source -type f -name gradlew -print -quit)")
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "gradlew tidak ditemukan di dalam ZIP."
            find android_source -maxdepth 3 -type f | head -100
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Make Gradle wrapper executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate APK
        shell: bash
        run: |
          set -e
          APK=$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/*.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan."
            exit 1
          fi
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "APK berhasil dibuat: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KinerjaKu-debug-APK
          path: ${{ env.APK }}
          if-no-files-found: error
